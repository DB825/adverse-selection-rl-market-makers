name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Verify published evidence
        run: python -m scripts.verify_publication
      - name: Exercise training and evaluation
        run: |
          python -m scripts.run_managed train --config configs/smoke.yaml --policy recurrent --seed 11 --output results/ci_smoke
          python -m scripts.run_managed evaluate --policy recurrent --checkpoint results/ci_smoke/model.zip --episodes 16 --seed-start 900000 --output results/ci_smoke_eval
          python -m scripts.run_managed evaluate --policy recurrent --checkpoint results/ci_smoke/model.zip --episodes 16 --seed-start 900000 --output results/ci_smoke_eval
          python -m scripts.run_managed verify results/ci_smoke_eval
