# 98 rollouts x 1024 transitions = 100352 (~100000 requested pilot steps).
environment:
  horizon: 64
  inventory_penalty: 0.001
  fee: 0.0
training:
  total_timesteps: 100352
  seeds: [11, 12, 13, 14, 15]
  n_envs: 8
  n_steps: 128
  batch_size: 64
  n_epochs: 10
  learning_rate: 0.0003
  gamma: 1.0
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  history_window: 8
  torch_threads: 1
  torch_mkldnn: true
  fused_lstm_reset: true
  device: cpu
evaluation:
  episodes: 1024
  seed: 1000000
analysis:
  episodes: 1024
  seed: 3000000
