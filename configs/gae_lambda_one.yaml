# Single-factor recurrent GAE ablation. Other training settings are fixed.
environment:
  horizon: 64
  inventory_penalty: 0.001
  fee: 0.0
training:
  total_timesteps: 300032
  seeds:
  - 11
  - 12
  - 13
  - 14
  - 15
  n_envs: 8
  n_steps: 128
  batch_size: 64
  n_epochs: 10
  learning_rate: 0.0003
  gamma: 1.0
  gae_lambda: 1.0
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  history_window: 8
  torch_threads: 1
  torch_mkldnn: true
  fused_lstm_reset: true
  device: cpu
evaluation:
  episodes: 2048
  seed: 8000000
analysis:
  episodes: 1024
  seed: 9000000
development:
  episodes: 1024
  seed: 7000000
